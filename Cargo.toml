[workspace]
resolver = "2"
members = ["crates/duox", "crates/duox-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cmac = "0.7"
cipher = { version = "0.4", features = ["alloc"] }
sha2 = "0.10"
p256 = { version = "0.14", features = ["arithmetic", "ecdsa"] }
bp256 = { version = "0.14", features = ["arithmetic", "ecdsa", "sha256"] }
ecdsa = { version = "0.17", features = ["algorithm", "sha2", "getrandom"] }
crc32fast = "1"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
pcsc = "2"
rfd = "0.15"
iced = { version = "0.14", features = ["tokio", "advanced"] }

[profile.dev.package."*"]
opt-level = 2
